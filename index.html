function alertas(D){const qa=D.quinzena_atual,a=[];

 <div class="bl">${r.map(s=>{const cr=criterios(D,s);const okN=cr.filter(c=>c[1]==='ok').length;const allOk=okN===cr.length;const w=Math.min(100,s.mes.vendas),pj=Math.min(100,s.projecao);
 return `<div class="bi"><div class="bi-h"><span class="av">${ini(s.nome)}</span><b>${s.nome}</b><span class="bi-c">${okN} de ${cr.length} critérios</span><span class="bi-v"><b>${s.mes.vendas}</b> / 100</span></div>
  <div class="trk"><span class="pj" style="width:${pj}%"></span><span class="rl" style="width:${w}%"></span>${[25,50,75].map(m=>`<i style="left:${m}%"></i>`).join('')}</div>
  <div class="bi-f"><span>Projeção <b>${s.projecao}</b></span><span>${s.falta_100?`Faltam <b>${s.falta_100}</b>, ${fmt(s.ritmo_100)} por dia útil`:'Meta de vendas batida'}</span><span>${allOk?`Prêmio <b>${brl(s.premio_prev)}</b>`:'Prêmio ainda não liberado'}</span></div>
  <div class="crit">${cr.map(c=>`<div class="cr cr-${c[1]}"><i>${IC[c[1]]}</i><div><b>${c[0]}</b><span>${c[2]}</span></div></div>`).join('')}</div></div>`}).join('')}</div></div>`;}

function delta(a,b,isPct){if(a==null||b==null)return '<span class="dn">–</span>';const d=b-a;const c=d>0?'up':d<0?'down':'eq';return `<span class="d ${c}">${d>0?'▲':d<0?'▼':'='} ${isPct?fmt(Math.abs(d))+' p.p.':Math.abs(d)}</span>`;}
function vComp(D){const q2on=D.quinzena_atual==='q2';
 const head=`<tr><th class="l">Vendedor</th><th colspan="3">Vendas</th><th colspan="3">APP</th><th colspan="3">PL</th><th colspan="3">QYC</th><th>Mês</th></tr><tr class="sub"><th></th>${'<th>Q1</th><th>Q2</th><th>Δ</th>'.repeat(4)}<th>Total</th></tr>`;
 const rows=D.sellers.map(s=>{const a=s.q1,b=s.q2;const v2=q2on?b:null;
  const c=(k,p)=>`<td class="gs">${p?pct(a[k]):a[k]}</td><td>${v2?(p?pct(b[k]):b[k]):'<span class="dn">–</span>'}</td><td>${v2?delta(a[k],b[k],p):'<span class="dn">–</span>'}</td>`;
  return `<tr><td class="l"><span class="av sm">${ini(s.nome)}</span><b>${s.nome}</b></td>${c('vendas')}${c('app_pct',1)}${c('pl_pct',1)}${c('qyc_pct',1)}<td><b>${s.mes.vendas}</b></td></tr>`;}).join('');
 const t1=D.sellers.reduce((x,s)=>x+s.q1.vendas,0),t2=D.sellers.reduce((x,s)=>x+s.q2.vendas,0);
 return `${q2on?'':'<div class="pace">A 2ª quinzena começa em 16/10. As colunas Q2 e as variações serão preenchidas a partir daí.</div>'}<div class="panel">
 <div class="scroll"><table class="tb cmp"><thead>${head}</thead><tbody>${rows}<tr class="tot"><td class="l">Total do time</td><td>${t1}</td><td>${q2on?t2:'–'}</td><td>${q2on?delta(t1,t2):'–'}</td><td colspan="9"></td><td>${t1+t2}</td></tr></tbody></table></div></div>`;}

function vCart(D){const ic={1:'<i class="dot d1"></i>',2:'<i class="dot d2"></i>',3:'<i class="dot d3"></i>'};const all=D.sellers.flatMap(s=>s.pendentes);const c=k=>all.filter(p=>p.prio===k).length;
 return `<div class="chips"><div class="chip"><b>${all.length}</b><span>clientes pendentes</span></div><div class="chip c1"><b>${c(1)}</b><span><i class="dot d1"></i>APP + PL pendentes</span></div><div class="chip c2"><b>${c(2)}</b><span><i class="dot d2"></i>só APP pendente</span></div><div class="chip c3"><b>${c(3)}</b><span><i class="dot d3"></i>só PL pendente</span></div></div>
 <p class="note" style="margin:0 0 14px">Priorize de cima para baixo. Toque no telefone para abrir o WhatsApp do cliente.</p>
 ${D.sellers.map(s=>`<div class="panel cart"><h3><span class="av sm">${ini(s.nome)}</span>${s.nome} <span class="cnt">${s.pendentes.length}</span></h3>${s.pendentes.length?`<div class="scroll"><table class="tb"><thead><tr><th></th><th class="l">Cliente</th><th>Venda</th><th>Telefone</th><th>Pendente</th><th>QYC</th></tr></thead><tbody>${s.pendentes.map(p=>`<tr class="p${p.prio}"><td>${ic[p.prio]}</td><td class="l">${p.cliente}</td><td>${p.data}</td><td class="nw"><a href="https://wa.me/55${p.fone.replace(/\D/g,'')}" target="_blank" rel="noopener">${p.fone}</a></td><td><b>${p.pend}</b></td><td>${p.qyc}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Carteira em dia.</p>'}</div>`).join('')}`;}

const VIEWS={geral:vGeral,vendedores:vVend,bonificacao:vBonus,comparativo:vComp,carteira:vCart};

let tab='geral',qsel=null;
function render(){const v=document.getElementById('view');v.innerHTML=VIEWS[tab](DATA,qsel);
 v.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{qsel=b.dataset.q;render();});}
document.getElementById('upd').textContent='Dados até '+DATA.ultima_data;
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;render();window.scrollTo(0,0);});
render();
</script></body></html>
